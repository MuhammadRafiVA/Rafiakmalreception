<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8e8cc">
  <title>Rafi & Akmal | Wedding Invitation</title>
  <style>
    :root {
      --cream: #f8e8cc;
      --maroon: #6f1d2b;
      --ink: #3b241e;
      --gold: #b28a4b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    .page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
      background: var(--cream);
    }
    .invitation {
      position: relative;
      width: min(100%, 760px);
      line-height: 0;
      box-shadow: 0 12px 35px rgba(55, 35, 20, .14);
      background: var(--cream);
    }
    .invitation img {
      display: block;
      width: 100%;
      height: auto;
    }
    .open-button {
      position: absolute;
      left: 50%;
      top: 68%;
      transform: translate(-50%, -50%);
      width: 74%;
      height: 31%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .open-button:focus-visible {
      outline: 3px solid var(--maroon);
      outline-offset: 5px;
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 7%;
      transform: translateX(-50%);
      color: var(--maroon);
      font: 600 11px/1.4 Arial, sans-serif;
      letter-spacing: .25em;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }
    .second-page { display: none; padding: 0 18px 30px; }
    .second-page.show { display: block; animation: reveal .8s ease both; }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .details-wrap {
      width: min(100%, 760px);
      margin: 0 auto;
      position: relative;
    }
    .details-wrap > img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 12px 35px rgba(55, 35, 20, .12);
    }
    .countdown {
      position: relative;
      margin: -1px auto 0;
      width: 100%;
      padding: 24px 12px 28px;
      text-align: center;
      background: var(--cream);
      color: var(--maroon);
      border-top: 1px solid rgba(111,29,43,.18);
    }
    .countdown h2 {
      margin: 0 0 14px;
      font-size: 13px;
      letter-spacing: .35em;
      font-weight: normal;
    }
    .timer {
      display: flex;
      justify-content: center;
      gap: clamp(8px, 3vw, 28px);
      flex-wrap: wrap;
    }
    .time-unit { min-width: 58px; }
    .time-unit strong {
      display: block;
      font-size: clamp(25px, 6vw, 42px);
      font-weight: normal;
      letter-spacing: .06em;
    }
    .time-unit span {
      display: block;
      margin-top: 4px;
      font: 10px Arial, sans-serif;
      letter-spacing: .2em;
    }
    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 12px 30px;
      background: var(--cream);
    }
    .actions a, .actions button {
      display: inline-block;
      border: 1px solid var(--maroon);
      border-radius: 30px;
      padding: 12px 18px;
      color: var(--maroon);
      background: transparent;
      text-decoration: none;
      font: 12px Arial, sans-serif;
      letter-spacing: .08em;
      cursor: pointer;
    }
    .actions a:hover, .actions button:hover {
      color: white;
      background: var(--maroon);
    }
    .music-note {
      text-align: center;
      color: #795c4a;
      background: var(--cream);
      font: 11px Arial, sans-serif;
      padding: 0 12px 25px;
    }
    .back {
      display: block;
      margin: 18px auto 0;
      border: 0;
      background: none;
      color: var(--maroon);
      text-decoration: underline;
      cursor: pointer;
      font: 12px Arial, sans-serif;
    }
    @media (min-width: 800px) {
      .page { padding: 32px; }
      .second-page { padding-top: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="page" id="cover" aria-label="Wedding invitation cover">
      <div class="invitation">
        <img src="assets/invitation-page-1.jpg" alt="Rafi and Akmal wedding invitation envelope cover">
        <button class="open-button" id="openInvite" aria-label="Open wedding invitation" title="Tap to open invitation"></button>
        <div class="hint">TAP THE ENVELOPE</div>
      </div>
    </section>

    <section class="second-page" id="details" aria-label="Wedding details">
      <div class="details-wrap">
        <img src="assets/invitation-page-2.jpg" alt="Wedding invitation details for Muhammad Rafi and Dr. Akmal Sithara">
        <section class="countdown" aria-live="polite">
          <h2>♡ COUNTDOWN ♡</h2>
          <div class="timer">
            <div class="time-unit"><strong id="days">00</strong><span>DAYS</span></div>
            <div class="time-unit"><strong id="hours">00</strong><span>HOURS</span></div>
            <div class="time-unit"><strong id="minutes">00</strong><span>MINUTES</span></div>
            <div class="time-unit"><strong id="seconds">00</strong><span>SECONDS</span></div>
          </div>
        </section>
        <div class="actions">
          <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Century+Staples+Convention+Centre+Erattupetta">Get directions</a>
          <a target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Wedding%20of%20Rafi%20%26%20Akmal&dates=20261227T113000/20261227T143000&details=Nikkah%20and%20wedding%20celebration&location=Century%20Staples%20Convention%20Centre%2C%20Erattupetta">Add to calendar</a>
          <button id="musicButton" type="button">♫ Play music</button>
        </div>
        <p class="music-note">With love, Rafi & Akmal</p>
        <button class="back" id="backToCover" type="button">Back to envelope</button>
      </div>
    </section>
  </main>

  <!-- Add your own royalty-free MP3 file as assets/wedding-music.mp3 to enable music. -->
  <audio id="weddingMusic" loop preload="none">
    <source src="assets/wedding-music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const cover = document.getElementById('cover');
    const details = document.getElementById('details');

    document.getElementById('openInvite').addEventListener('click', () => {
      cover.style.display = 'none';
      details.classList.add('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('backToCover').addEventListener('click', () => {
      details.classList.remove('show');
      details.style.display = 'none';
      cover.style.display = 'grid';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => { details.style.display = ''; }, 50);
    });

    // Countdown to 27 December 2026, 5:00 PM India time.
    const weddingDate = new Date('2026-12-27T17:00:00+05:30').getTime();
    function updateCountdown() {
      const remaining = weddingDate - Date.now();
      const safe = Math.max(0, remaining);
      document.getElementById('days').textContent = Math.floor(safe / 86400000);
      document.getElementById('hours').textContent = String(Math.floor((safe % 86400000) / 3600000)).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor((safe % 3600000) / 60000)).padStart(2, '0');
      document.getElementById('seconds').textContent = String(Math.floor((safe % 60000) / 1000)).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    const music = document.getElementById('weddingMusic');
    const musicButton = document.getElementById('musicButton');
    musicButton.addEventListener('click', async () => {
      if (music.paused) {
        try {
          await music.play();
          musicButton.textContent = '♫ Pause music';
        } catch (e) {
          musicButton.textContent = 'Add wedding-music.mp3';
        }
      } else {
        music.pause();
        musicButton.textContent = '♫ Play music';
      }
    });
  </script>
</body>
</html>
